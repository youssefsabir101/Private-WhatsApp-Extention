
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private WhatsApp</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      background: #111b21;
      color: #e9edef;
      font: 14px Arial, sans-serif;
    }
    h2 { margin: 0 0 8px; font-size: 20px; }
    h3 { margin: 14px 0 6px; font-size: 14px; }
    p { color: #aebac1; line-height: 1.45; }
    label { display: block; margin-top: 10px; color: #d6dfe3; }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      font-size: 14px;
    }
    input, select {
      background: #202c33;
      color: white;
      border: 1px solid #52616b;
    }
    button {
      border: 0;
      background: #00a884;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #35454f; }
    button.danger { background: #c94b4b; }
    hr { border: 0; border-top: 1px solid #35454f; margin: 14px 0; }
    #status { min-height: 18px; margin-bottom: 0; }
    small { color: #8696a0; }
  </style>
</head>
<body>
  <h2>🔒 Private WhatsApp</h2>
  <p>Privacy controls · Local settings</p>

  <button id="blurToggle" class="secondary">Loading...</button>
  <button id="lockNow">🔐 Lock WhatsApp</button>
  <button id="panic" class="danger">🚨 Panic Button</button>

  <hr>
  <h3>🎚️ Blur strength</h3>
  <label for="blurStrength">Choose blur level</label>
  <select id="blurStrength">
    <option value="4">Light — 4px</option>
    <option value="6">Normal — 6px</option>
    <option value="8">Strong — 8px</option>
    <option value="12">Maximum — 12px</option>
  </select>

  <label>
    <input id="hideSidebar" type="checkbox" style="width:auto">
    Hide conversation sidebar
  </label>

  <hr>
  <h3>🔑 PIN Lock</h3>
  <label for="pin">New PIN (at least 6 digits)</label>
  <input id="pin" type="password" inputmode="numeric"
    autocomplete="new-password" placeholder="Enter PIN">
  <button id="savePin">Set / Change PIN</button>
  <button id="removePin" class="secondary">Remove PIN</button>

  <hr>
  <h3>⏱️ Auto-lock</h3>
  <label for="autoLock">Lock after inactivity</label>
  <select id="autoLock">
    <option value="0">Off</option>
    <option value="1">1 minute</option>
    <option value="5">5 minutes</option>
    <option value="10">10 minutes</option>
  </select>

  <p id="status" role="status"></p>
  <small>Local extension · No analytics</small>
  <script src="popup.js"></script>
</body>
</html>
